<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Customer Conversion Prediction Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="mx-auto" style="max-width:720px;">
            <h1 class="mb-4">Customer Conversion Prediction Tool</h1>

            <form action="{{ url_for('predict_datapoint') }}" method="post" novalidate>
                <fieldset class="border p-3 mb-4">
                    <legend class="w-auto px-2">Customer Conversion Prediction Tool</legend>

                    <div class="mb-3">
                        <label class="form-label">Age</label>
                        <input class="form-control" type="number" name="Age" placeholder="Enter your Age" min='0' required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Gender</label>
                        <select class="form-control form-select" name="Gender" required>
                            <option selected disabled value="">Select your Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Income</label> 
                        <input class="form-control" type="number" name="Income" placeholder="Enter your Income" min='0' required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Campaign Channel</label>
                        <select class="form-control form-select" name="CampaignChannel" required>
                            <option selected disabled value="">Select Campaign Channel</option>
                            <option value="Email">Email</option>
                            <option value="Social Media">Social Media</option>
                            <option value="Search Engine">Search Engine</option>
                            <option value="Referral">Referral</option>
                            <option value="PPC">PPC</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Campaign Type</label>
                        <select class="form-control form-select" name="CampaignType" required>
                            <option selected disabled value="">Select Campaign Type</option>
                            <option value="Awareness">Awareness</option>
                            <option value="Consideration">Consideration</option>
                            <option value="Conversion">Conversion</option>
                            <option value="Retention">Retention</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">AdSpend</label> 
                        <input class="form-control" type="number" name="AdSpend" placeholder="Enter your Income" min='0' required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Click Through Rate</label> 
                        <input class="form-control" type="number" step="0.0001" name="ClickThroughRate" placeholder="Enter your Click Through Rate" min='0' required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Conversion Rate</label> 
                        <input class="form-control" type="number" step="0.0001" name="ConversionRate" placeholder="Enter your Conversion Rate" min='0' required />
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Website Visit</label>  
                        <input class="form-control" type="number" step="0.01" name="WebsiteVisits" placeholder="Enter your Website Visits" min='0' required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Pages Per Visit</label>  
                        <input class="form-control" type="number" step="0.01" name="PagesPerVisit" placeholder="Enter your Pages Per Visit" min='0' required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Time On Site </label>  
                        <input class="form-control" type="number" step="0.01" name="TimeOnSite" placeholder="Enter your Time On Site" min='0' required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Social Media Shares </label>  
                        <input class="form-control" type="number" name="SocialShares" placeholder="Enter the number of Social Media Shares" min='0' required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Opens</label>  
                        <input class="form-control" type="number" name="EmailOpens" placeholder="Enter the number of Email Opens" min='0' required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Clicks</label>  
                        <input class="form-control" type="number" name="EmailClicks" placeholder="Enter the number of Email Clicks" min='0' required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Previous Purchases </label>  
                        <input class="form-control" type="number" name="PreviousPurchases" placeholder="Enter the number of Previous Purchases" min='0' required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Loyalty Points</label>  
                        <input class="form-control" type="number" name="LoyaltyPoints" placeholder="Enter the number of Loyalty Points" min='0' required />
                    </div>

                    <div class="mb-3">
                        <input class="btn btn-primary" type="submit" value="Predict Conversion Likelihood" />
                    </div>
                </fieldset>
            </form>

            {% if results is defined %}
                <div class="alert alert-info">
                    <strong>Prediction:</strong> {{ results }}
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
